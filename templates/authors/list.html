{% extends "base.html" %}

{% block content %}
<div class="post">
    <div class="item-title">
        {{ taxonomy.name | capitalize }}
    </div>
    <div class="item-content">
        <ul type="square" class="authors" role="navigation" aria-label="Authors">
            {% for term in terms %}
            <li>
                <a href="{{ term.permalink | safe }}" title="View details">
                    <span class="author">{{ term.name }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
{% endblock %}
